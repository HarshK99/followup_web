name: Deploy followupx_web to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_DISABLE_TURBOPACK: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify production build
        run: |
          test -f .next/BUILD_ID
          test -d .next/server
          test -d .next/static

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: followupx-web-artifacts
          path: |
            .next/**
            public/**
            package.json
            package-lock.json
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: followupx-web-artifacts
          path: artifacts

      - name: Upload artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "artifacts/*"
          target: "/var/www/followupx_web/artifacts/"
          timeout: 300s
          command_timeout: 30m

      - name: Start app on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 1800s
          script: |
            set -e

            cd /var/www/followupx_web/artifacts

            test -f .next/BUILD_ID

            npm install --omit=dev

            pm2 reload /var/www/followupx_web/ecosystem.config.js || \
            pm2 start /var/www/followupx_web/ecosystem.config.js

            pm2 save
