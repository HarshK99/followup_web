name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - master  # Change to your main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_API_BASE_URL: https://followapi.paperthoughts.in

    - name: Prepare deploy bundle
      run: |
        mkdir deploy
        cp -r .next deploy/
        cp -r public deploy/
        cp package.json deploy/
        cp package-lock.json deploy/
        cp ecosystem.config.js deploy/

    - name: Deploy to VPS
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "deploy/"
        target: ${{ secrets.VPS_DEPLOY_PATH }}
        strip_components: 1

    - name: Verify deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd ${{ secrets.VPS_DEPLOY_PATH }}
          if [ ! -d ".next/static" ]; then
            echo ".next/static directory is missing!"
            exit 1
          fi
          echo "Deployment verified: .next/static exists"

    - name: Start app on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd ${{ secrets.VPS_DEPLOY_PATH }}          npm ci          pm2 delete followupx_web || true
          pm2 start ecosystem.config.js
          pm2 save