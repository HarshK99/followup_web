name: Deploy followupx_web to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_DISABLE_TURBOPACK: 1
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: |
          test -f .next/BUILD_ID
          test -d .next/server
          test -d .next/static

      - uses: actions/upload-artifact@v4
        with:
          name: followupx-web-artifacts
          path: |
            .next/**
            public/**
            package.json
            package-lock.json
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: followupx-web-artifacts
          path: artifacts

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/followupx_web/artifacts

      - name: Upload artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "artifacts/*"
          target: "/var/www/followupx_web/artifacts"
          strip_components: 1

      - name: Start app on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /var/www/followupx_web/artifacts

            test -f .next/BUILD_ID

            npm install --omit=dev

            pm2 reload /var/www/followupx_web/ecosystem.config.js || \
            pm2 start /var/www/followupx_web/ecosystem.config.js

            pm2 save
