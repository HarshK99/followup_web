name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_API_BASE_URL: https://followapi.paperthoughts.in

    - name: Verify build output
      run: |
        if [ ! -f .next/BUILD_ID ]; then
          echo "BUILD_ID not found"
          exit 1
        fi
        if [ ! -d .next/static ]; then
          echo ".next/static not found"
          exit 1
        fi
        echo "Build verification passed"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nextjs-build
        path: |
          .next/**
          public/**
          package.json
          package-lock.json
          ecosystem.config.js
        include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: nextjs-build
        path: deploy

    - name: Clean old build on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd "${{ secrets.VPS_DEPLOY_PATH }}"
          rm -rf .next

    - name: Deploy to VPS
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "deploy/"
        target: ${{ secrets.VPS_DEPLOY_PATH }}
        strip_components: 1

    - name: Start app on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd "${{ secrets.VPS_DEPLOY_PATH }}"
          test -f .next/BUILD_ID || exit 1
          npm ci --omit=dev
          pm2 restart followup-web --update-env || pm2 start ecosystem.config.js
          pm2 save
          curl -f http://localhost:5001/auth/login || exit 1